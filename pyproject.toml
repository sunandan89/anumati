[project]
name = "anumati"
authors = [
    { name = "Dhwani RIS" }
]
description = "Open-source, field-first DPDP consent platform for nonprofits"
requires-python = ">=3.10"
readme = "README.md"
license = { file = "LICENSE" }
dynamic = ["version"]
dependencies = [
    # frappe and cryptography come with the Frappe bench (frappe >= 15, < 16)
    "jsonschema>=4.17",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B"]
ignore = ["E501", "W191", "E101"]

[tool.ruff.format]
indent-style = "tab"
