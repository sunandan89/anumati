name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/guide/**", "tools/build_guide.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy site/ to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Size budget (spec §12, under 300 KB before fonts, excluding the prototype)
        run: |
          size=$(du -cb site/index.html site/assets/* | tail -1 | cut -f1)
          echo "site size: $size bytes"; test "$size" -lt 307200
      - name: Build the product guide and QA test cases (docs/guide → site/guide)
        run: |
          pip install -q markdown
          python3 tools/build_guide.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
