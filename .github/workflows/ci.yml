name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Python compiles, JSON parses
        run: |
          python -m compileall -q anumati ci
          find anumati -name '*.json' -print0 | xargs -0 -n1 python -m json.tool > /dev/null
      - name: Form scripts parse
        run: find anumati -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Ledger primitives (no Frappe needed)
        run: |
          pip install -q cryptography
          PYTHONPATH=. python ci/ledger_selftest.py

  server:
    name: Frappe tests and security gates
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 45
    services:
      redis-cache:
        image: redis:alpine
        ports: ["13000:6379"]
      redis-queue:
        image: redis:alpine
        ports: ["11000:6379"]
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=2s --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install MariaDB client
        run: sudo apt-get update -q && sudo apt-get install -y -q mariadb-client

      - name: Set up bench (Frappe v16)
        run: |
          pip install -q frappe-bench
          bench init --skip-redis-config-generation --skip-assets --frappe-branch version-16 --python "$(which python)" ~/frappe-bench
          mysql --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mysql --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install app on two tenant sites
        working-directory: /home/runner/frappe-bench
        env:
          CI: "Yes"
        run: |
          bench get-app anumati "$GITHUB_WORKSPACE"
          bench setup requirements --dev
          for site in tenant-a.localhost tenant-b.localhost; do
            bench new-site --db-root-password root --admin-password admin "$site"
            bench --site "$site" install-app anumati
            bench --site "$site" set-config allow_tests true
          done

      - name: Unit tests (insert-only, chain, roles, PII, workflows)
        working-directory: /home/runner/frappe-bench
        run: |
          set -o pipefail
          bench --site tenant-a.localhost run-tests --app anumati 2>&1 | tee /tmp/tests.log

      - name: Failing tests, in short
        if: failure()
        run: |
          grep -E '^ ?(ERROR|FAIL):? |^[A-Za-z_.]+(Error|Exception): ' /tmp/tests.log | head -200 || true

      - name: Start server
        working-directory: /home/runner/frappe-bench
        run: |
          nohup bench serve --port 8000 --noreload > /tmp/serve.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -H "Host: tenant-a.localhost" http://127.0.0.1:8000/api/method/ping > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/serve.log; exit 1

      - name: HTTP security gates (unauthenticated routes, tenant isolation)
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site tenant-a.localhost execute anumati.tests.ci_setup.prepare --args '["/tmp/tenant-a.json"]'
          bench --site tenant-b.localhost execute anumati.tests.ci_setup.prepare --args '["/tmp/tenant-b.json"]'
          bench --site tenant-a.localhost execute anumati.tests.ci_setup.inventory --args '["/tmp/inventory.json"]'
          ./env/bin/python "$GITHUB_WORKSPACE/ci/security_http_check.py" http://127.0.0.1:8000 \
            tenant-a.localhost tenant-b.localhost /tmp/tenant-a.json /tmp/tenant-b.json /tmp/inventory.json

      - name: Server log on failure
        if: failure()
        run: tail -n 200 /tmp/serve.log || true

  upgrade:
    name: Upgrade from main (migration patches keep data and chains)
    runs-on: ubuntu-latest
    needs: checks
    if: github.ref != 'refs/heads/main'
    timeout-minutes: 45
    services:
      redis-cache:
        image: redis:alpine
        ports: ["13000:6379"]
      redis-queue:
        image: redis:alpine
        ports: ["11000:6379"]
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=2s --health-retries=5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # main may still be on Frappe v15 (Python 3.11): the "before" bench uses whatever main's code declares,
      # so this job also proves the v15 -> v16 move for existing sites.
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.11
            3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install MariaDB client
        run: sudo apt-get update -q && sudo apt-get install -y -q mariadb-client

      - name: Pick the Frappe version main runs on
        run: |
          base="$(git merge-base HEAD origin/main)"
          git branch -f upgrade-base "$base"
          git branch -f upgrade-head HEAD
          if git show "$base:pyproject.toml" | grep -q 'frappe = ">=15'; then
            echo "BASE_FRAPPE=version-15" >> "$GITHUB_ENV"; echo "BASE_PYTHON=python3.11" >> "$GITHUB_ENV"
          else
            echo "BASE_FRAPPE=version-16" >> "$GITHUB_ENV"; echo "BASE_PYTHON=python3.14" >> "$GITHUB_ENV"
          fi

      - name: Set up benches (main's Frappe, and Frappe v16 for this branch)
        run: |
          pip install -q frappe-bench
          bench init --skip-redis-config-generation --skip-assets --frappe-branch "$BASE_FRAPPE" --python "$(which $BASE_PYTHON)" ~/bench-base
          bench init --skip-redis-config-generation --skip-assets --frappe-branch version-16 --python "$(which python3.14)" ~/frappe-bench
          mysql --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mysql --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install the app as it is on main, with sample data
        working-directory: /home/runner/bench-base
        env:
          CI: "Yes"
        run: |
          # bench installs the branch its source is on, so hand it a copy already on main's code.
          git clone -q --branch upgrade-base "$GITHUB_WORKSPACE" /tmp/src-base
          bench get-app anumati /tmp/src-base
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin upgrade.localhost
          bench --site upgrade.localhost install-app anumati
          bench --site upgrade.localhost set-config allow_tests true
          bench --site upgrade.localhost execute anumati.demo.create_sample_data
          bench --site upgrade.localhost execute anumati.ledger.chain.seal_audit_trail
          python3 "$GITHUB_WORKSPACE/ci/upgrade_snapshot.py" upgrade.localhost /tmp/before.json

      - name: Move the site to Frappe v16 with this branch, and migrate
        working-directory: /home/runner/frappe-bench
        env:
          CI: "Yes"
        run: |
          git clone -q --branch upgrade-head "$GITHUB_WORKSPACE" /tmp/src-head
          bench get-app anumati /tmp/src-head
          bench setup requirements --dev
          # Same database: the site folder moves to the new bench, as a Frappe Cloud bench upgrade does.
          cp -r ~/bench-base/sites/upgrade.localhost sites/
          # v16 migrate checks Redis first; point this bench at the job's Redis services.
          bench set-config -g redis_cache redis://127.0.0.1:13000
          bench set-config -g redis_queue redis://127.0.0.1:11000
          bench --site upgrade.localhost migrate
          python3 "$GITHUB_WORKSPACE/ci/upgrade_snapshot.py" upgrade.localhost /tmp/after.json
          python3 "$GITHUB_WORKSPACE/ci/upgrade_snapshot.py" --compare /tmp/before.json /tmp/after.json
